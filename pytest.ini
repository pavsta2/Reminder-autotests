[pytest]
# Базовые опции запуска
addopts =
    --strict-markers
    --tb=short
    -ra

# Где искать тесты
testpaths = tests

# Таймаут ожиданий Playwright по умолчанию (мс) — также настраивается в conftest.py через expect.set_options
# base_url используется Page Object'ами через config.settings, а не через pytest-playwright base_url,
# т.к. у нас несколько окружений/ролей.

markers =
    ui: UI-тесты через Playwright
    api: API-проверки через requests
    functional: функциональные тесты (happy path, бизнес-логика)
    validation: тесты валидации (BVA/EP, граничные значения, сообщения об ошибках)
    negative: негативные сценарии
    smoke: быстрые smoke-проверки критичных флоу
    email: тест реально ждёт письмо по IMAP (медленно) — по умолчанию исключать через -m "not email"

    # Маркеры по компонентам (QA Labels / Components исходных test-кейсов)
    auth: авторизация / логин
    my_reminders: страница "My reminders"
    issue_panel: контекстная секция/панель напоминаний на странице задачи
    queue: админская очередь (Queue)
    permissions: раздел Permissions
    dashboard_gadget: dashboard-гаджет напоминаний
    recipients: поле Recipients в форме создания/редактирования ремайндера
    creation_form: кнопки Create/Cancel формы создания ремайндера (вне привязки к конкретному полю)
    message: поле Message (Quill rich-text) в форме создания/редактирования ремайндера
